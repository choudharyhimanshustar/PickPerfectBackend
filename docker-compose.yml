services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A src.app_celery.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env.development
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Runs the scheduled Celery tasks defined in celery_app.beat_schedule
  # (mark-stale-pending-as-failed, requeue-from-dlq). A worker alone does
  # not tick the schedule — Beat is what fires them.
  celery-beat:
    build: .
    command: celery -A src.app_celery.celery_app beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env.development
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Drains the SQS queue (fed by the S3-upload Lambda) and kicks off the
  # Celery processing chain. Without this, uploaded videos are never consumed.
  sqs-poller:
    build: .
    command: python -m src.app_celery.sqs_poller
    volumes:
      - .:/app
    env_file:
      - .env.development
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
